# Runs when this crate is the GitHub repository root (or via workflow_dispatch).
# Nested monorepo checkouts can invoke: bash xml-fuzz/scripts/ci-xml-fuzz.sh
name: xml-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test + short fuzz
        run: bash scripts/ci-xml-fuzz.sh
